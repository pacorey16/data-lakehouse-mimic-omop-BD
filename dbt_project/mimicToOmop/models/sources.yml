version: 2

sources:

  - name: vocabulary
    database: iceberg
    schema: vocabulary
    tables:
      - name: concept
        description: Tabla de conceptos del vocabulario OMOP.
      - name: concept_relationship
        description: Tabla de relaciones entre conceptos del vocabulario OMOP.
  - name: mimic
    description: Tablas crudas de MIMIC-IV cargadas en Iceberg (schema mimic-bronze).
    database: hive
    schema: mimic_bronze
    tables:
      - name: patients
        description: Información demográfica de pacientes.
        columns:
          - name: subject_id
            description: Identificador único del paciente.
            tests:
              - unique
              - not_null
          - name: gender
            tests:
              - not_null
              - accepted_values:
                  values: ['M', 'F']
          - name: anchor_age
            tests:
              - not_null
          - name: anchor_year
            tests:
              - not_null
          - name: anchor_year_group
          - name: dod

      - name: admissions
        description: Ingresos hospitalarios.
        columns:
          - name: subject_id
            tests:
              - not_null
          - name: hadm_id
            description: Identificador único del ingreso.
            tests:
              - unique
              - not_null
          - name: admittime
            tests:
              - not_null
          - name: dischtime
          - name: deathtime
          - name: admission_type
            tests:
              - not_null
          - name: admit_provider_id
          - name: admission_location
          - name: discharge_location
          - name: insurance
          - name: language
          - name: marital_status
          - name: race
          - name: edregtime
          - name: edouttime
          - name: hospital_expire_flag
            tests:
              - not_null
              - accepted_values:
                  values: [0, 1]

      - name: diagnoses_icd
        description: Diagnósticos codificados con ICD-9/ICD-10.
        columns:
          - name: subject_id
            tests:
              - not_null
          - name: hadm_id
            tests:
              - not_null
          - name: seq_num
            tests:
              - not_null
          - name: icd_code
            tests:
              - not_null
          - name: icd_version
            tests:
              - not_null
              - accepted_values:
                  values: [9, 10]

