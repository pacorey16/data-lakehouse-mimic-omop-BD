version: "3.8"

networks:
  trabajobd_network:
    driver: bridge

volumes:
  pg-data:
  minio-data:
  airflow-logs:

services:
  # =======================================================
  # PostgreSQL (productos_db)
  # =======================================================
  postgres:
    image: postgres:13
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    command: postgres -c password_encryption=md5 -c hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    networks:
      - trabajobd_network

  # =======================================================
  # Trino
  # =======================================================
  trino:
    image: trinodb/trino:latest
    container_name: trino
    hostname: trino
    restart: unless-stopped
    user: root
    environment:
      - TRINO_CONFIG_DIR=/etc/trino
      - HADOOP_CONF_DIR=/etc/hadoop/conf
    volumes:
      - ./trino/conf:/etc/trino
      - ./trino/conf/catalog:/etc/trino/catalog
      - ./trino/conf/core-site.xml:/etc/hadoop/conf/core-site.xml
      - ./trino/init_mimic_bronze.sql:/etc/trino/init_mimic_bronze.sql
    depends_on:
      postgres:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8082:8080"
    networks:
      - trabajobd_network

  # =======================================================
  # MinIO (almacenamiento S3-compatible)
  # =======================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Consola web
    volumes:
      - minio-data:/data
    networks:
      - trabajobd_network

  # =======================================================
  # MinIO Init â€” crea el bucket al arrancar
  # =======================================================
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 15;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/landing-zone;
      mc mb --ignore-existing local/mimic-bronze;
      mc mb --ignore-existing local/omop-silver;
      mc mb --ignore-existing local/mimic-vocabulary;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - trabajobd_network

  # =======================================================
  # Hive Metastore 
  # =======================================================
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    restart: on-failure:5
    entrypoint: >
      /bin/bash -c "
      export HADOOP_CLASSPATH=/opt/hadoop/share/hadoop/tools/lib/*;
      /opt/hive/bin/schematool --skiphadoopversion -initSchema -dbType postgres || true;
      exec /opt/hive/bin/hive --skiphadoopversion --skiphbasecp --service metastore
      "
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_CLIENT_OPTS: >-
        -Xmx1G
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
    volumes:
      - ./trino/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    ports:
      - "9083:9083"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9083"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    depends_on:
      - postgres
      - minio
    networks:
      - trabajobd_network

  # =======================================================
  # Airflow 
  # =======================================================
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow
    hostname: airflow
    user: "0:0"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_CONN_MINIO_CONN=aws://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@?endpoint_url=http%3A%2F%2Fminio%3A9000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - ../datos_simulados/lotes_landing:/opt/airflow/data/lotes_landing
      - ../dbt_project:/opt/airflow/dbt_project
    entrypoint: /bin/bash
    command: /init-airflow.sh
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8080"
    networks:
      - trabajobd_network
  # =======================================================
  # Spark
  # =======================================================
  spark:
    image: jupyter/pyspark-notebook:latest
    container_name: spark
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/work
    env_file:
      - .env
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=''
    networks:
      - trabajobd_network
